<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 320" role="img" aria-label="Vial de medicamento elaborado con proteínas del plasma">
  <defs>
    <linearGradient id="liq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE6A0"/>
      <stop offset=".55" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#D9A521"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A8A8A"/>
      <stop offset=".35" stop-color="#E6E6E6"/>
      <stop offset=".7" stop-color="#A9A9A9"/>
      <stop offset="1" stop-color="#6F6F6F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body"><rect x="18" y="104" width="84" height="196" rx="14"/></clipPath>
  </defs>
  <!-- Tapón -->
  <rect x="28" y="54" width="64" height="18" rx="4" fill="#AB192D"/>
  <rect x="30" y="70" width="60" height="22" rx="3" fill="url(#cap)"/>
  <!-- Cuello -->
  <rect x="36" y="90" width="48" height="16" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2"/>
  <!-- Cuerpo -->
  <rect x="18" y="104" width="84" height="196" rx="14" fill="url(#glass)"/>
  <g clip-path="url(#body)">
    <rect x="18" y="150" width="84" height="160" fill="url(#liq)" opacity=".94"/>
    <path d="M18 150h84" stroke="#FFF6D6" stroke-opacity=".9" stroke-width="2"/>
    <rect x="25" y="110" width="10" height="182" rx="5" fill="url(#shine)" opacity=".55"/>
  </g>
  <rect x="18" y="104" width="84" height="196" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2.5"/>
  <!-- Etiqueta -->
  <rect x="18" y="196" width="84" height="64" fill="#FFFFFF" opacity=".95"/>
  <rect x="18" y="196" width="84" height="5" fill="#AB192D"/>
  <rect x="28" y="212" width="52" height="5" rx="2.5" fill="#363636" opacity=".6"/>
  <rect x="28" y="223" width="38" height="4" rx="2" fill="#363636" opacity=".35"/>
  <rect x="28" y="233" width="46" height="4" rx="2" fill="#363636" opacity=".35"/>
  <rect x="28" y="244" width="22" height="7" rx="2" fill="#FDC300"/>
</svg>
